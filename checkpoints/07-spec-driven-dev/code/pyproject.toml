# Minimal project config so pytest, ruff, and mypy work out of the box.

[tool.pytest.ini_options]
# Lets `from app.main import app` work when you run `pytest` from coach/.
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true    # anthropic / fastmcp stubs aren't needed for the workshop
